name: Deploy extension zip to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build extension zip
        run: bun run build

      - name: Generate download page
        run: |
          VERSION=$(git rev-parse --short=7 HEAD)
          mkdir -p _site
          cat > _site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Browser MCP — Extension</title>
            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { width: 560px; margin: 64px auto; padding: 0 20px; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #111; background: #fff; line-height: 1.5; }
              h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.4px; margin-bottom: 4px; }
              .sub { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 20px; }
              .desc { font-size: 13px; color: #111; margin-bottom: 26px; }
              .dl { display: inline-block; padding: 10px 22px; background: #111; color: #fff; text-decoration: none; font-weight: 600; font-size: 13px; border: 1px solid #111; }
              .dl:hover { background: #000; }
              .guide { display: none; margin-top: 18px; border: 1px solid #111; padding: 14px 16px; font-size: 12px; }
              .guide.show { display: block; }
              .guide b { font-weight: 700; }
              .guide code { background: #f5f5f5; border: 1px solid #ddd; padding: 1px 4px; }
              .guide ol { margin: 10px 0 0 20px; }
              .guide li { margin-bottom: 8px; }
              .guide .hint { margin-top: 10px; color: #666; }
              .meta { margin-top: 18px; font-size: 10px; color: #999; }
              .foot { margin-top: 26px; }
              .foot a { color: #999; display: inline-flex; align-items: center; }
              .foot a:hover { color: #111; }
              .foot svg { width: 18px; height: 18px; fill: currentColor; }
            </style>
          </head>
          <body>
            <h1>Browser MCP</h1>
            <div class="sub">chrome / edge extension</div>
            <p class="desc">Turns the browser into an MCP server for AI agents: 67 browser tools, direct code-mcp-gateway mode, screen recording, TTS narration, page annotations.</p>

            <a class="dl" id="dl" href="browser-mcp-extension.zip">Download</a>

            <div class="guide" id="guide">
              <b>Install</b>
              <ol>
                <li>Open <code>chrome://extensions</code> (or <code>edge://extensions</code>)</li>
                <li>Enable <b>Developer mode</b> (top right)</li>
                <li>Unzip <code>browser-mcp-extension.zip</code></li>
                <li>Click <b>Load unpacked</b> and select the unzipped <code>browser-mcp-extension</code> folder</li>
              </ol>
              <p class="hint">Then click the toolbar icon, enter your gateway Device ID and Token, and connect.</p>
            </div>

            <p class="meta">Build: ${VERSION}</p>
            <div class="foot">
              <a href="https://github.com/Tuanm/browser-mcp" aria-label="Source on GitHub">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
              </a>
            </div>

            <script>
              document.getElementById("dl").addEventListener("click", function () {
                document.getElementById("guide").classList.add("show");
              });
            </script>
          </body>
          </html>
          HTML

      - name: Copy zip to site
        run: |
          mkdir -p _site
          cp dist/browser-extension.zip _site/browser-mcp-extension.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
